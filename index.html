<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leonels App Library</title>
  <link rel="canonical" href="https://suspendednetwork.github.io/Leonels-app-Library/index.html" /> 
  <link rel="canonical" href="https://suspendednetwork.github.io/Leonels-app-Library/" />

  <link rel="canonical" href="https://apps.suspendednetwork.tech/" /> 

  <style>
    :root {
      --bg: #0d1117;
      --canvas: #0d1117;
      --panel: #161b22;
      --panel-2: #1c2128;
      --text: #c9d1d9;
      --muted: #8b949e;
      --border: #30363d;
      --border-strong: #484f58;
      --accent: #58a6ff;
      --success: #3fb950;
      --danger: #f85149;
      --shadow: 0 1px 0 rgba(27,31,36,0.04);
      --radius: 8px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      line-height: 1.5;
    }

    body {
      overflow-x: hidden;
    }

    /* hide matrix + glow overlay */
    #matrix,
    .bg-overlay {
      display: none !important;
    }

    .container {
      position: relative;
      z-index: 2;
      width: min(1100px, 94vw);
      margin: 0 auto;
      padding: 1.25rem 0.2rem 2rem;
    }

    .panel {
      border: 1px solid var(--border);
      background: var(--panel);
      box-shadow: var(--shadow);
      border-radius: var(--radius);
    }

    header.site-header {
      padding: 1rem;
      margin-bottom: 1rem;
    }

    .title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .75rem;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-size: 1.5rem;
      color: #f0f6fc;
      font-weight: 600;
      letter-spacing: 0;
      text-shadow: none;
    }

    .subtitle {
      margin: 0.4rem 0 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .counter {
      border: 1px solid var(--border);
      padding: 0.25rem 0.6rem;
      border-radius: 999px;
      color: var(--text);
      background: var(--panel-2);
      font-size: 0.85rem;
      white-space: nowrap;
    }

    .controls {
      margin: 0 0 1rem;
      padding: 0.8rem;
      display: grid;
      gap: 0.5rem;
    }

    .search-wrap {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #0d1117;
      padding: 0.45rem 0.65rem;
    }

    .search-wrap span {
      color: var(--muted);
      font-size: 0.95rem;
    }

    #searchInput {
      width: 100%;
      border: none;
      outline: none;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 0.95rem;
    }

    #searchInput::placeholder {
      color: var(--muted);
    }

    .apps-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 0.85rem;
    }

    .app-card {
      padding: 0.9rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--panel);
      transition: border-color 120ms ease, transform 120ms ease;
    }

    .app-card:hover {
      border-color: var(--border-strong);
      transform: translateY(-1px);
    }

    .card-top {
      display: flex;
      gap: 0.7rem;
      align-items: center;
      margin-bottom: 0.65rem;
    }

    .app-logo, .fallback-icon {
      width: 2rem;
      height: 2rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #0d1117;
      flex: 0 0 auto;
    }

    .app-logo { object-fit: cover; }

    .fallback-icon {
      display: none;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 600;
    }

    .app-name {
      margin: 0;
      color: #f0f6fc;
      font-size: 1rem;
      line-height: 1.2;
      font-weight: 600;
    }

    .app-desc {
      margin: 0 0 0.75rem;
      color: var(--muted);
      font-size: 0.92rem;
      min-height: 2.8em;
    }

    .btn {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #21262d;
      color: var(--text);
      font: inherit;
      font-size: 0.9rem;
      font-weight: 500;
      padding: 0.55rem 0.75rem;
      cursor: pointer;
    }

    .btn:hover,
    .btn:focus-visible {
      background: #30363d;
      border-color: #8b949e66;
      outline: none;
    }

    .empty-state {
      margin-top: 0.8rem;
      padding: 0.8rem;
      border: 1px dashed var(--border);
      border-radius: 8px;
      color: var(--muted);
      text-align: center;
      background: var(--panel);
    }

    footer {
      margin-top: 1rem;
      padding: 0.75rem 1rem;
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
    }

    footer a {
      color: var(--accent);
      text-decoration: none;
    }

    footer a:hover { text-decoration: underline; }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 30;
      background: rgba(1,4,9,0.72);
      display: none;
      align-items: center;
      justify-content: center;
      padding: .9rem;
    }

    .modal-backdrop.open { display: flex; }

    .modal {
      width: min(1000px, 100%);
      max-height: 90vh;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--panel);
      display: flex;
      flex-direction: column;
    }

    .modal-head {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: .7rem;
      padding: .9rem;
      border-bottom: 1px solid var(--border);
      background: #161b22;
    }

    .modal-head-left {
      display: flex;
      gap: .7rem;
      align-items: center;
      min-width: 0;
    }

    .modal-title {
      margin: 0;
      font-size: 1.05rem;
      color: #f0f6fc;
    }

    .modal-desc {
      margin: .15rem 0 0;
      color: var(--muted);
      font-size: .9rem;
    }

    .close-btn {
      border: 1px solid var(--border);
      background: #21262d;
      color: var(--text);
      border-radius: 6px;
      font: inherit;
      font-size: .88rem;
      padding: .4rem .6rem;
      cursor: pointer;
    }

    .close-btn:hover,
    .close-btn:focus-visible {
      background: #30363d;
      outline: none;
    }

    .modal-body {
      padding: .9rem;
      overflow: auto;
    }

    .readme-wrap {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: .9rem;
      background: #0d1117;
      min-height: 140px;
    }

    .loading { color: var(--muted); }
    .error { color: var(--danger); }

    .readme-wrap h1, .readme-wrap h2, .readme-wrap h3, .readme-wrap h4 {
      color: #f0f6fc;
      margin-top: 1rem;
      margin-bottom: .45rem;
      line-height: 1.25;
    }

    .readme-wrap p, .readme-wrap li {
      color: var(--text);
      line-height: 1.5;
      word-break: break-word;
    }

    .readme-wrap a { color: var(--accent); }

    .readme-wrap code {
      background: rgba(110,118,129,0.2);
      border: 1px solid rgba(240,246,252,0.1);
      border-radius: 6px;
      padding: .1rem .3rem;
      font-size: .9em;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }

    .readme-wrap pre {
      background: #161b22;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: .75rem;
      overflow: auto;
    }

    .readme-wrap pre code {
      border: none;
      background: transparent;
      padding: 0;
    }

    /* Side ads + responsive behavior */
    .side-ad {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      z-index: 3;
      width: 160px;
      min-height: 600px;
      display: none;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
      overflow: hidden;
    }
    .side-ad-left { left: 12px; }
    .side-ad-right { right: 12px; }

    @media (min-width: 1200px) {
      .side-ad { display: flex !important; }
      .container { width: min(900px, calc(100vw - 380px)); }
    }

    @media (max-width: 1199px) {
      .side-ad { display: none !important; }
      .container { width: min(1100px, 94vw); }
    }

    /* Bottom ad */
    .bottom-ad-shell { margin-top: 1rem; }

    .bottom-ad {
      width: 728px;
      height: 90px;
      max-width: 100%;
      margin: 0 auto;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .bottom-ad::after {
      content: "Advertisement";
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.08em;
      z-index: 0;
    }

    .bottom-ad > * {
      position: relative;
      z-index: 1;
    }

    .bottom-ad.is-loading > * { opacity: 0; }
    .bottom-ad.is-ready::after { display: none; }
    .bottom-ad.is-ready > * { opacity: 1; }

    .bottom-ad iframe,
    .bottom-ad > div,
    .bottom-ad ins {
      display: block !important;
      margin: 0 auto !important;
      position: static !important;
      mix-blend-mode: normal !important;
    }

    @media (max-width: 580px) {
      .container { width: 95vw; }
      .modal-head { padding: 0.8rem; }
      .modal-body { padding: 0.75rem; }
    }
  </style>
</head>

<!-- Matrix background -->
  <canvas id="matrix" aria-hidden="true"></canvas>
  <div class="bg-overlay" aria-hidden="true"></div>
  

  <div class="container">
    <header class="site-header panel">
      <div class="title-row">
        <h1>Leonels App Library</h1>
        <div class="counter" id="appCounter">Apps: 0</div>
      </div>
      <p class="subtitle">
        A collection of apps, that work on school macbooks
      </p>
    </header>
    

    <section class="controls panel">
      <label class="search-wrap" for="searchInput">
        <span>⌕</span>
        <input
          id="searchInput"
          type="text"
          placeholder="Search apps by name..."
          autocomplete="off"
        />
      </label>
    </section>

    <main>
      <section id="appsGrid" class="apps-grid" aria-live="polite"></section>
      <div id="emptyState" class="empty-state" hidden>No apps match your search.</div>
    </main>

    <footer class="panel">
      GitHub:
      <a href="https://github.com/Suspendednetwork/Leonels-app-Library" target="_blank" rel="noopener noreferrer">
        Suspendednetwork/Leonels-app-Library
      </a>
    </footer>
  </div>
  

  <!-- Reusable Modal -->
  <div id="modalBackdrop" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal">
      <div class="modal-head">
        <div class="modal-head-left">
          <img id="modalLogo" class="app-logo" alt="" />
          <div id="modalLogoFallback" class="fallback-icon" aria-hidden="true">APP</div>
          <div>
            <h2 id="modalTitle" class="modal-title">App Name</h2>
            <p id="modalDescription" class="modal-desc"></p>
          </div>
        </div>
        <button id="closeModalBtn" class="close-btn" type="button" aria-label="Close popup">✕ Close</button>
      </div>
      <div class="modal-body">
        <div id="readmeContent" class="readme-wrap">
          <p class="loading">Loading README...</p>
        </div>
      </div>
    </div>
  </div>

  <!-- marked.js CDN for Markdown parsing -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <script>
    /**
     * Leonels App Library
     * Single-file, GitHub Pages-ready app catalog with:
     * - Matrix animated background
     * - Dynamic app cards from JS array
     * - Reusable modal loading markdown READMEs
     * - Search + app counter
     * - Fallback handling for missing logos/README
     */

    // --------------------------
    // 1) App data source (reusable system)
    // --------------------------
    const apps = [
      {
        name: "Roblox ProjectRB",
        logo: "logos/projectrb.png",
        description: "Roblox mac player.",
        readme: "https://raw.githubusercontent.com/Suspendednetwork/Leonels-app-Library/refs/heads/github-pages/readmds/roblox.md"
      },
            {
        name: "Steam Macndcheese",
        logo: "logos/steam.png",
        description: "Windows version of steam.",
        readme: "https://raw.githubusercontent.com/Suspendednetwork/Leonels-app-Library/refs/heads/github-pages/readmds/macndcheese.md"
      },
      {
        name: "Epic Games",
        logo: "logos/epic.png",
        description: "native version of epic games.",
        readme: "https://raw.githubusercontent.com/Suspendednetwork/Leonels-app-Library/refs/heads/github-pages/readmds/epic.md"
      },
            {
        name: "Stremio",
        logo: "logos/stremio.png",
        description: "Stremio for movies and shows.",
        readme: "https://raw.githubusercontent.com/Suspendednetwork/Leonels-app-Library/refs/heads/github-pages/readmds/stremio.md"
      },
       {
        name: "Prism Launcher Cracked Mc",
        logo: "logos/Prism.png",
        description: "this is Prism launcher a minecraft launcher SINGLEPLAYER ONLY.",
        readme: "https://raw.githubusercontent.com/Suspendednetwork/Leonels-app-Library/refs/heads/github-pages/readmds/Prism.md"
      },
      {
        name: "Brave Browser",
        logo: "logos/Brave.png",
        description: "Brave Browser a browser based on chromium.",
        readme: "https://raw.githubusercontent.com/Suspendednetwork/Leonels-app-Library/refs/heads/github-pages/readmds/Brave.md"
      },
      {
        name: "Assaultcube",
        logo: "logos/assaultcube.png",
        description: "Assaultcube is a FPS(first person shooter) it is lightweight and like counter strike and is pretty fun with friends.",
        readme: "https://raw.githubusercontent.com/Suspendednetwork/Leonels-app-Library/refs/heads/github-pages/readmds/assaultcube.md"
      },
      {
        name: "Steam (Native)",
        logo: "logos/steam.png",
        description: "This is the native version of steam.",
        readme: "https://raw.githubusercontent.com/Suspendednetwork/Leonels-app-Library/refs/heads/github-pages/readmds/Steammac.md"
      },
      {
        name: "Spotify",
        logo: "logos/Spotify.png",
        description: "this is a modded spotify that has ad free listening and unlimited skips",
        readme: "https://raw.githubusercontent.com/Suspendednetwork/Leonels-app-Library/refs/heads/github-pages/readmds/spotify.md"
      },
    ];

    // --------------------------
    // 2) DOM references
    // --------------------------
    const appsGrid = document.getElementById("appsGrid");
    const searchInput = document.getElementById("searchInput");
    const appCounter = document.getElementById("appCounter");
    const emptyState = document.getElementById("emptyState");

    const modalBackdrop = document.getElementById("modalBackdrop");
    const modalLogo = document.getElementById("modalLogo");
    const modalLogoFallback = document.getElementById("modalLogoFallback");
    const modalTitle = document.getElementById("modalTitle");
    const modalDescription = document.getElementById("modalDescription");
    const readmeContent = document.getElementById("readmeContent");
    const closeModalBtn = document.getElementById("closeModalBtn");

    let currentAppInModal = null;

    // --------------------------
    // 3) Utility helpers
    // --------------------------
    function sanitizeText(value, fallback = "N/A") {
      if (typeof value !== "string") return fallback;
      const trimmed = value.trim();
      return trimmed.length ? trimmed : fallback;
    }

    function initialsFromName(name) {
      const parts = sanitizeText(name, "APP").split(/\s+/).slice(0, 2);
      return parts.map(p => p[0]?.toUpperCase() || "").join("") || "APP";
    }

    function updateCounter(count) {
      appCounter.textContent = `Apps: ${count}`;
    }

    // --------------------------
    // 4) Card rendering system
    // --------------------------
    function createAppCard(app, index) {
      const name = sanitizeText(app.name, "Unnamed App");
      const description = sanitizeText(app.description, "No description available.");
      const logo = sanitizeText(app.logo, "");
      const readme = sanitizeText(app.readme, "");

      const card = document.createElement("article");
      card.className = "app-card";
      card.style.animationDelay = `${Math.min(index * 70, 500)}ms`;

      card.innerHTML = `
        <div class="card-top">
          <img class="app-logo" alt="${name} logo" />
          <div class="fallback-icon" aria-hidden="true">${initialsFromName(name)}</div>
          <h3 class="app-name">${name}</h3>
        </div>
        <p class="app-desc">${description}</p>
        <button class="btn" type="button">Open README</button>
      `;

      const img = card.querySelector(".app-logo");
      const fallback = card.querySelector(".fallback-icon");
      const button = card.querySelector(".btn");

      function showFallback() {
        img.style.display = "none";
        fallback.style.display = "inline-flex";
      }

      if (logo) {
        img.src = logo;
        img.addEventListener("error", showFallback, { once: true });
      } else {
        showFallback();
      }

      button.addEventListener("click", () => {
        openModal({ name, description, logo, readme });
      });

      return card;
    }

    function renderApps(list) {
      appsGrid.innerHTML = "";
      list.forEach((app, i) => {
        appsGrid.appendChild(createAppCard(app, i));
      });

      updateCounter(list.length);
      emptyState.hidden = list.length !== 0;
    }

    function filterApps() {
      const q = searchInput.value.trim().toLowerCase();
      if (!q) {
        renderApps(apps);
        return;
      }

      const filtered = apps.filter(app =>
        sanitizeText(app.name, "").toLowerCase().includes(q)
      );
      renderApps(filtered);
    }

    // --------------------------
    // 5) Reusable modal + README loader
    // --------------------------
    function setModalLogo(logo, name) {
      modalLogo.style.display = "";
      modalLogoFallback.style.display = "none";
      modalLogoFallback.textContent = initialsFromName(name);

      function showFallback() {
        modalLogo.style.display = "none";
        modalLogoFallback.style.display = "inline-flex";
      }

      if (logo) {
        modalLogo.src = logo;
        modalLogo.alt = `${name} logo`;
        modalLogo.onerror = showFallback;
      } else {
        showFallback();
      }
    }

    async function loadReadme(readmeUrl) {
      // If missing README URL
      if (!readmeUrl) {
        readmeContent.innerHTML = `<p class="error">README URL not provided for this app.</p>`;
        return;
      }

      readmeContent.innerHTML = `<p class="loading">Loading README...</p>`;

      try {
        const response = await fetch(readmeUrl, { cache: "no-store" });
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const markdown = await response.text();
        if (!markdown.trim()) {
          readmeContent.innerHTML = `<p class="error">README is empty.</p>`;
          return;
        }

        const html = marked.parse(markdown);
        readmeContent.innerHTML = html;
      } catch (error) {
        readmeContent.innerHTML = `
          <p class="error">Failed to load README. ${String(error.message || error)}</p>
        `;
      }
    }

    function openModal(app) {
      currentAppInModal = app;

      modalTitle.textContent = sanitizeText(app.name, "Unnamed App");
      modalDescription.textContent = sanitizeText(app.description, "No description available.");
      setModalLogo(sanitizeText(app.logo, ""), sanitizeText(app.name, "APP"));

      modalBackdrop.classList.add("open");
      document.body.style.overflow = "hidden";

      loadReadme(sanitizeText(app.readme, ""));
    }

    function closeModal() {
      modalBackdrop.classList.remove("open");
      document.body.style.overflow = "";
      currentAppInModal = null;
      readmeContent.innerHTML = `<p class="loading">Loading README...</p>`;
    }

    closeModalBtn.addEventListener("click", closeModal);

    modalBackdrop.addEventListener("click", (e) => {
      if (e.target === modalBackdrop) closeModal();
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && modalBackdrop.classList.contains("open")) {
        closeModal();
      }
    });

    // --------------------------
    // 6) Search behavior
    // --------------------------
    searchInput.addEventListener("input", filterApps);

    // --------------------------
    // 7) Matrix rain animation
    // --------------------------
    (function matrixRain() {
      const canvas = document.getElementById("matrix");
      const ctx = canvas.getContext("2d");
      const chars = "アァカサタナハマヤャラワ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ$#@%&*";
      const fontSize = 16;
      let columns = 0;
      let drops = [];

      function resize() {
        const dpr = window.devicePixelRatio || 1;
        canvas.width = Math.floor(window.innerWidth * dpr);
        canvas.height = Math.floor(window.innerHeight * dpr);
        canvas.style.width = `${window.innerWidth}px`;
        canvas.style.height = `${window.innerHeight}px`;

        // Draw in CSS pixels while honoring DPR
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        columns = Math.ceil(window.innerWidth / fontSize);
        drops = Array.from({ length: columns }, () => Math.random() * -40);
      }

      function draw() {
        ctx.fillStyle = "rgba(2, 9, 6, 0.09)";
